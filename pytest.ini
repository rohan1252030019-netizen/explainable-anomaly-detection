[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
timeout = 180
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    deep: marks deep learning tests requiring torch
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning